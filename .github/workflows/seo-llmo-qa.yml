name: SEO & LLMO QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-seo-qa:
    name: Validate static SEO package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run SEO and LLMO checks
        run: npm test
